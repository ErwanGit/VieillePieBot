services:
  bot:
    container_name: vp_bot
    restart: unless-stopped
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    tty: true
    env_file:
      - ./.env
    environment:
      - TOKEN=${TOKEN}
      - GNEWS_TOKEN=${GNEWS_TOKEN}
      - WEATHER_TOKEN=${WEATHER_TOKEN}
      - GUILD_ID=${GUILD_ID}
      - MSG_TODAY_CHANNEL=${MSG_TODAY_CHANNEL}
      - BIRTHDAY_ROLE=${BIRTHDAY_ROLE}
      - ENV_TYPE=production
      - TZ=Europe/Paris